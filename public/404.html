<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Page not found · BlackHook</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@400&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; min-height: 100%; background: #17171b; color: #f4f0e8; }
      body {
        min-height: 100vh; display: grid; place-items: center; padding: 32px 20px; box-sizing: border-box;
        background: radial-gradient(110% 70% at 50% 0%, #2a2216 0%, #17171b 60%);
        font-family: 'Geist Mono', ui-monospace, monospace;
      }
      main { max-width: 520px; display: grid; gap: 22px; }
      .code { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #d4b56a; }
      h1 { margin: 0; font-family: 'Instrument Serif', 'Times New Roman', serif; font-weight: 400; font-size: clamp(2.4rem, 8vw, 3.6rem); line-height: 1.05; letter-spacing: -0.02em; }
      h1 em { color: #d4b56a; }
      p { margin: 0; font-size: 14px; line-height: 1.7; color: rgba(244, 240, 232, 0.72); }
      nav { display: flex; flex-wrap: wrap; gap: 12px; }
      a { color: #f4f0e8; text-decoration: none; border: 1px solid rgba(244, 240, 232, 0.28); padding: 12px 18px; font-size: 13px; transition: border-color 0.2s, background 0.2s; }
      a:hover { border-color: #d4b56a; background: rgba(212, 181, 106, 0.08); }
      a:focus-visible { outline: 2px solid #d4b56a; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <span class="code">404 · Not found</span>
      <h1>This page isn't <em>here</em>.</h1>
      <p>The link may have a typo, or the page has moved. These two are always here:</p>
      <nav>
        <a href="/hitesh">Hitesh Agrawal · portfolio</a>
        <a href="/">BlackHook Studio</a>
      </nav>
    </main>
  </body>
</html>
